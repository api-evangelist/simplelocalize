aid: simplelocalize
name: SimpleLocalize
description: >-
  SimpleLocalize is a web-based translation management platform that helps small and growing teams save time on handling
  localization files and translation strings. It provides a REST API for managing translations, languages, projects, and
  customers, along with integrations for CI/CD pipelines, frameworks, and AI-powered tools.
type: Index
