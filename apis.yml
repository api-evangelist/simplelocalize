apis:
- aid: simplelocalize:language-api
  name: SimpleLocalize Language API
  description: >-
    The SimpleLocalize Language API provides endpoints to create, list, update, and delete languages within
    a project. Each language is identified by a unique key and requires API key authentication via the
    X-SimpleLocalize-Token header.
  humanURL: https://simplelocalize.io/docs/api/language-api/
  baseURL: https://api.simplelocalize.io
  tags:
  - Languages
  - Localization
  properties:
  - type: Documentation
    url: https://simplelocalize.io/docs/api/language-api/
- aid: simplelocalize:projects-api
  name: SimpleLocalize Projects API
  description: >-
    The SimpleLocalize Projects API allows creation and listing of translation projects. It uses Personal
    Token authentication (Bearer) rather than API keys, enabling multi-project management workflows.
  humanURL: https://simplelocalize.io/docs/api/translation-project-management/
  baseURL: https://api.simplelocalize.io
  tags:
  - Projects
  - Management
  properties:
  - type: Documentation
    url: https://simplelocalize.io/docs/api/translation-project-management/
- aid: simplelocalize:customer-api
  name: SimpleLocalize Customer API
  description: >-
    The SimpleLocalize Customer API enables creation and management of customer-specific translations.
    Customers represent end-user segments with their own translation overrides, identified by a unique
    customer key.
  humanURL: https://simplelocalize.io/docs/api/customer-specific-api/
  baseURL: https://api.simplelocalize.io
